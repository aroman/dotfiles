# screenie is managed in nixos/flake.nix and home-desktop.nix, using the system
# nixpkgs so its libc can load the system GPU drivers. Our fork fixes GPUI
# ignoring removed monitors (after the LG sleeps, the selector skips it):
# https://github.com/johnpyp/screenie/pull/2. Once merged, switch the flake input
# back to upstream and restart the daemon with `screenie quit`.
#
# CleanShot X preset from screenie's README: cards bottom-right, copy on capture,
# cards slide away after 60s.
screenshot:
  after_capture: { copy: true, save: false, preview: true, edit: false }
preview:
  position: bottom-right
  timeout: 60
editor:
  mode: window
  exit_on_copy: true
