id = "aroman/voxtype"
name = "Voxtype"
version = "2.0.0"
plugin_api = 14
author = "aroman"
license = "MIT"
icon = "microphone-2"
description = "Shows Voxtype's live dictation status in the bar."
dependencies = ["voxtype"]
tags = ["audio", "bar", "indicator", "recording"]

[[widget]]
id = "status"
entry = "widget.luau"

  [widget.actions]
  left = "exec voxtype record toggle"
  right = "exec voxtype record stop"
